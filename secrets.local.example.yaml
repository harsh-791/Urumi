# Copy to secrets.local.yaml (gitignored) or run scripts/gen-secrets.sh.
# store.secrets.wooMcpToken and platform.secrets.wooMcpToken must match.
store:
  secrets:
    create: true
    dbPassword: change-me
    dbRootPassword: change-me
    wpAdminPassword: change-me
    wcConsumerKey: ck_change_me
    wcConsumerSecret: cs_change_me
    wooMcpToken: change-me
platform:
  secrets:
    create: true
    dbPassword: change-me
    adminPassword: change-me
    credentialKey: change-me-base64-32-bytes
    openaiApiKey: sk-change-me
    wooMcpToken: change-me
    notesMcpToken: change-me
    clockMcpToken: change-me
