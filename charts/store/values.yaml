storageClass: standard
wordpress:
  image: wordpress:7.1-php8.3-apache
  coreVersion: "7.1.3"
  woocommerceVersion: "11.2.1"
  cliImage: wordpress:cli-2.12-php8.3
  url: http://store.127.0.0.1.sslip.io
  title: Urumi Goods
  adminUser: admin
  adminEmail: admin@urumi.local
mariadb:
  image: mariadb:11.4
wooMcp:
  repository: urumi-woo-mcp
  tag: local
  pullPolicy: IfNotPresent
ingress:
  className: nginx
  host: store.127.0.0.1.sslip.io
  controllerNamespace: ingress-nginx
  controllerLabelKey: app.kubernetes.io/name
  controllerLabelValue: ingress-nginx
  tls: false
  tlsSecret: store-tls
networkPolicy: true
platformNamespace: ""
secrets:
  create: false
  name: store-secrets
  dbPassword: ""
  dbRootPassword: ""
  wpAdminPassword: ""
  wcConsumerKey: ""
  wcConsumerSecret: ""
  wooMcpToken: ""
persistence:
  mariadb: 5Gi
  wordpress: 5Gi
