apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: woo-mcp
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: woo-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: woo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: woo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: woo-mcp
        app.kubernetes.io/part-of: urumi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: woo-mcp
          image: "{{ .Values.wooMcp.repository }}:{{ .Values.wooMcp.tag }}"
          imagePullPolicy: {{ .Values.wooMcp.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: WOO_BASE_URL
              value: http://wordpress
            - name: WOO_PUBLIC_HOST
              value: {{ .Values.ingress.host | quote }}
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: wc-consumer-key
            - name: WOO_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: wc-consumer-secret
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: woo-mcp-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
