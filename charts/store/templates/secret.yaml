{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ required "secrets.dbPassword" .Values.secrets.dbPassword | quote }}
  db-root-password: {{ required "secrets.dbRootPassword" .Values.secrets.dbRootPassword | quote }}
  wp-admin-password: {{ required "secrets.wpAdminPassword" .Values.secrets.wpAdminPassword | quote }}
  wc-consumer-key: {{ required "secrets.wcConsumerKey" .Values.secrets.wcConsumerKey | quote }}
  wc-consumer-secret: {{ required "secrets.wcConsumerSecret" .Values.secrets.wcConsumerSecret | quote }}
  woo-mcp-token: {{ required "secrets.wooMcpToken" .Values.secrets.wooMcpToken | quote }}
{{- end }}
