apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: urumi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.gateway.repository }}:{{ .Values.gateway.tag }}"
          imagePullPolicy: {{ .Values.gateway.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: urumi
            - name: PGDATABASE
              value: urumi
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: db-password
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: credential-key
            - name: ADMIN_EMAIL
              value: {{ .Values.adminEmail | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: admin-password
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: openai-api-key
            - name: OPENAI_MODEL
              value: {{ .Values.openaiModel | quote }}
            {{- if .Values.openaiBaseUrl }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.openaiBaseUrl | quote }}
            {{- end }}
            - name: COOKIE_SECURE
              value: {{ .Values.cookieSecure | quote }}
            - name: ALLOW_CLUSTER_URLS
              value: {{ .Values.allowClusterUrls | quote }}
            - name: WOO_MCP_URL
              value: http://woo-mcp.{{ .Release.Namespace }}.svc.cluster.local:8080/mcp
            - name: NOTES_MCP_URL
              value: http://notes-mcp.{{ .Release.Namespace }}.svc.cluster.local:8080/mcp
            - name: CLOCK_MCP_URL
              value: http://clock-mcp.{{ .Release.Namespace }}.svc.cluster.local:8080/mcp
            - name: WOO_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: woo-mcp-token
            - name: NOTES_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: notes-mcp-token
            - name: CLOCK_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: clock-mcp-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
