apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioner
  labels:
    {{- include "platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-store-provisioner
  labels:
    {{- include "platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "serviceaccounts", "persistentvolumeclaims", "pods", "events", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-store-provisioner
  labels:
    {{- include "platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-store-provisioner
subjects:
  - kind: ServiceAccount
    name: provisioner
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioner
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provisioner
        app.kubernetes.io/part-of: urumi
    spec:
      serviceAccountName: provisioner
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provisioner
          image: "{{ .Values.gateway.repository }}:{{ .Values.gateway.tag }}"
          imagePullPolicy: {{ .Values.gateway.pullPolicy }}
          command: ["node", "dist/provision.js"]
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: urumi
            - name: PGDATABASE
              value: urumi
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: db-password
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: credential-key
            - name: ADMIN_EMAIL
              value: {{ .Values.adminEmail | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: admin-password
            - name: STORE_MAX_PER_USER
              value: {{ .Values.stores.maxPerUser | quote }}
            - name: STORE_HOST_SUFFIX
              value: {{ .Values.stores.hostSuffix | quote }}
            - name: STORE_STORAGE_CLASS
              value: {{ .Values.stores.storageClass | quote }}
            - name: STORE_INGRESS_CLASS
              value: {{ .Values.ingress.className | quote }}
            - name: STORE_INGRESS_CONTROLLER_NAMESPACE
              value: {{ .Values.ingress.controllerNamespace | quote }}
            - name: STORE_INGRESS_CONTROLLER_LABEL_KEY
              value: {{ .Values.ingress.controllerLabelKey | quote }}
            - name: STORE_INGRESS_CONTROLLER_LABEL_VALUE
              value: {{ .Values.ingress.controllerLabelValue | quote }}
            - name: STORE_PLATFORM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOSTED_PULL_POLICY
              value: {{ .Values.gateway.pullPolicy | quote }}
            - name: WOO_MCP_REPOSITORY
              value: {{ .Values.stores.wooMcpRepository | quote }}
            - name: WOO_MCP_TAG
              value: {{ .Values.stores.wooMcpTag | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["helm", "version", "--short"]
            periodSeconds: 20
          livenessProbe:
            exec:
              command: ["helm", "version", "--short"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
