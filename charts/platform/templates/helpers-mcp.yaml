apiVersion: v1
kind: Service
metadata:
  name: notes-mcp
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: notes-mcp
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: notes-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-mcp
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: notes-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notes-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notes-mcp
        app.kubernetes.io/part-of: urumi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notes-mcp
          image: "{{ .Values.notesMcp.repository }}:{{ .Values.notesMcp.tag }}"
          imagePullPolicy: {{ .Values.notesMcp.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: NOTES_FILE
              value: /data/notes.json
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: notes-mcp-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notes
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notes
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.persistence.notes }}
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass }}
  {{- end }}
---
