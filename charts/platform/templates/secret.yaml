{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ required "secrets.dbPassword" .Values.secrets.dbPassword | quote }}
  admin-password: {{ required "secrets.adminPassword" .Values.secrets.adminPassword | quote }}
  credential-key: {{ required "secrets.credentialKey" .Values.secrets.credentialKey | quote }}
  openai-api-key: {{ required "secrets.openaiApiKey" .Values.secrets.openaiApiKey | quote }}
  woo-mcp-token: {{ required "secrets.wooMcpToken" .Values.secrets.wooMcpToken | quote }}
  notes-mcp-token: {{ required "secrets.notesMcpToken" .Values.secrets.notesMcpToken | quote }}
  clock-mcp-token: {{ required "secrets.clockMcpToken" .Values.secrets.clockMcpToken | quote }}
{{- end }}
